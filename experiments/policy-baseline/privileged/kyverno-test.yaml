apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: baseline-privileged
policies:
  - policy.yaml
resources:
  - resources.yaml
results:
  - isValidatingPolicy: true
    policy: baseline-disallow-privileged
    kind: Pod
    resources: [privileged-normal]
    result: pass
  - isValidatingPolicy: true
    policy: baseline-disallow-privileged
    kind: Pod
    resources: [privileged-violation]
    result: fail
  - isValidatingPolicy: true
    policy: baseline-disallow-privileged
    kind: Pod
    resources: [privileged-missing]
    result: pass
  - isValidatingPolicy: true
    policy: baseline-disallow-privileged
    kind: Pod
    resources: [privileged-mixed]
    result: fail
