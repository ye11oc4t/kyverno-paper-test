apiVersion: v1
kind: Pod
metadata:
  name: nonroot-normal
  namespace: default
spec:
  containers:
    - name: app
      image: registry.example.com/demo:1
      securityContext:
        runAsNonRoot: true
---
apiVersion: v1
kind: Pod
metadata:
  name: nonroot-violation
  namespace: default
spec:
  containers:
    - name: app
      image: registry.example.com/demo:1
      securityContext:
        runAsNonRoot: false
---
apiVersion: v1
kind: Pod
metadata:
  name: nonroot-missing
  namespace: default
spec:
  containers:
    - name: app
      image: registry.example.com/demo:1
---
apiVersion: v1
kind: Pod
metadata:
  name: nonroot-mixed
  namespace: default
spec:
  containers:
    - name: app
      image: registry.example.com/demo:1
      securityContext:
        runAsNonRoot: true
    - name: sidecar
      image: registry.example.com/sidecar:1
      securityContext:
        runAsNonRoot: false
