apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: baseline-require-container-nonroot
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        object.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot == true)
      message: Every regular container must explicitly set runAsNonRoot to true in this baseline.
