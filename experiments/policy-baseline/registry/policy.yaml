apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: baseline-approved-registry
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        object.spec.containers.all(c, has(c.image) && c.image.startsWith('registry.example.com/'))
      message: Regular container images must use registry.example.com/ in this baseline.
