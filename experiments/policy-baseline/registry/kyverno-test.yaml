apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: baseline-registry
policies:
  - policy.yaml
resources:
  - resources.yaml
results:
  - isValidatingPolicy: true
    policy: baseline-approved-registry
    kind: Pod
    resources: [registry-normal]
    result: pass
  - isValidatingPolicy: true
    policy: baseline-approved-registry
    kind: Pod
    resources: [registry-violation]
    result: fail
  - isValidatingPolicy: true
    policy: baseline-approved-registry
    kind: Pod
    resources: [registry-missing]
    result: fail
  - isValidatingPolicy: true
    policy: baseline-approved-registry
    kind: Pod
    resources: [registry-mixed]
    result: fail
