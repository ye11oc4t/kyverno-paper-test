{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "offline-ephemeral-split-pair",
    "namespace": "study-consistency"
  },
  "spec": {
    "automountServiceAccountToken": false,
    "restartPolicy": "Never",
    "terminationGracePeriodSeconds": 0,
    "containers": [
      {
        "name": "study-base",
        "image": "study.local/approved/pause:3.10",
        "imagePullPolicy": "Never",
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 1000,
          "runAsGroup": 1000,
          "allowPrivilegeEscalation": false,
          "readOnlyRootFilesystem": true,
          "capabilities": {
            "drop": [
              "ALL"
            ]
          },
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        }
      }
    ],
    "ephemeralContainers": [
      {
        "name": "sample-a",
        "image": "study.local/approved/pause:3.10",
        "imagePullPolicy": "Never",
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 1000,
          "runAsGroup": 1000,
          "allowPrivilegeEscalation": false,
          "readOnlyRootFilesystem": true,
          "capabilities": {
            "drop": [
              "ALL"
            ]
          },
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        }
      },
      {
        "name": "study-b",
        "image": "study.local/alternate/pause:3.10",
        "imagePullPolicy": "Never",
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 1000,
          "runAsGroup": 1000,
          "allowPrivilegeEscalation": false,
          "readOnlyRootFilesystem": true,
          "capabilities": {
            "drop": [
              "ALL"
            ]
          },
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        }
      }
    ]
  }
}
