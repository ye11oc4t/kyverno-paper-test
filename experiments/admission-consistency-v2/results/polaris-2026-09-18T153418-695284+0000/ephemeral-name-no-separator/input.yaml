{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "offline-ephemeral-name-no-separator",
    "namespace": "study-consistency"
  },
  "spec": {
    "automountServiceAccountToken": false,
    "restartPolicy": "Never",
    "terminationGracePeriodSeconds": 0,
    "containers": [
      {
        "name": "study-base",
        "image": "study.local/approved/pause:3.10",
        "imagePullPolicy": "Never",
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 1000,
          "runAsGroup": 1000,
          "allowPrivilegeEscalation": false,
          "readOnlyRootFilesystem": true,
          "capabilities": {
            "drop": [
              "ALL"
            ]
          },
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        }
      }
    ],
    "ephemeralContainers": [
      {
        "name": "studya",
        "image": "study.local/approved/pause:3.10",
        "imagePullPolicy": "Never",
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 1000,
          "runAsGroup": 1000,
          "allowPrivilegeEscalation": false,
          "readOnlyRootFilesystem": true,
          "capabilities": {
            "drop": [
              "ALL"
            ]
          },
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        }
      }
    ]
  }
}
